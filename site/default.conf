# Replaces the nginx image's default vhost so /install.sh can redirect to the
# latest release's installer (generated by cargo-dist). A redirect instead of a
# hosted copy: the script would go stale between manual `fly deploy`s, and
# `curl -fsSL | sh` follows redirects.
server {
    listen 80;
    server_name plotui.xyz;
    root /usr/share/nginx/html;
    index index.html;

    location = /install.sh {
        return 302 https://github.com/sebaheg/plotui/releases/latest/download/plotui-installer.sh;
    }

    # TLS terminates at Fly's edge; relative Location headers keep redirects
    # on https instead of nginx guessing http:// from its own port 80.
    absolute_redirect off;

    # Extensionless page URLs: /examples serves examples.html, and the old
    # .html URLs 301 to the clean form so one canonical URL survives.
    # $request_uri (the client's original URI) distinguishes a real
    # /index.html request from the index directive's internal redirect for
    # "/" — redirecting the latter would loop.
    location = /index.html {
        if ($request_uri ~ ^/index\.html) {
            return 301 /;
        }
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Assets aren't fingerprinted, so browsers must revalidate on every load
    # (cheap: nginx sends ETags, unchanged files come back 304). Without this
    # a deploy pairs a browser's stale cached wasm-glue JS with the new .wasm
    # and every canvas fails to init.
    add_header Cache-Control "no-cache";
}

# Canonical-host redirect: plotui.fly.dev, www.plotui.xyz, and anything else
# lands here and is sent to https://plotui.xyz with the path preserved.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://plotui.xyz$request_uri;
}
