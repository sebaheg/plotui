[package]
name = "plotui-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "wasm-bindgen bindings: expose the plotui engine to the browser as an ES module."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plotui-core = { path = "../plotui-core" }
plotui-bind = { path = "../plotui-bind" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
