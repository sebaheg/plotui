[package]
name = "plotui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Plot data from stdin or files as real terminal pixels (Kitty graphics): line, scatter, bar."

[[bin]]
name = "plotui"
path = "src/main.rs"

[dependencies]
plotui-core = { workspace = true }
# The DOT parser and its error messages, shared with every other binding.
plotui-bind = { workspace = true }
plotui-term = { workspace = true }
plotui-ratatui = { workspace = true }
ratatui = { workspace = true, features = ["crossterm"] }
# use-dev-tty: read events from /dev/tty, so `data | plotui line` stays
# interactive — stdin is the data pipe, not the keyboard.
crossterm = { workspace = true, features = ["use-dev-tty"] }
clap = { version = "4", features = ["derive"] }
