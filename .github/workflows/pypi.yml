name: PyPI

# Builds and publishes the `plotui` PyPI package on every version tag: the
# Python library (PyO3 extension, abi3 ≥ 3.9) with the compiled CLI bundled
# inside the wheel at plotui/_bin/plotui, exposed as the `plotui` command via
# a [project.scripts] entry point.
#
# Publishing authenticates with the PYPI_API_TOKEN repo secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      # The Linux wheels compile inside maturin-action's manylinux container,
      # so the CLI must be built there too (same glibc floor) — hence
      # before-script-linux instead of a host step.
      - name: Bundle the CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release -p plotui --target ${{ matrix.target }}
          mkdir -p python/plotui/_bin
          cp target/${{ matrix.target }}/release/plotui python/plotui/_bin/plotui
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          before-script-linux: |
            cargo build --release -p plotui --target ${{ matrix.target }}
            mkdir -p python/plotui/_bin
            cp target/${{ matrix.target }}/release/plotui python/plotui/_bin/plotui
      - name: Check the CLI is inside the wheel
        run: |
          unzip -l dist/*.whl | grep "plotui/_bin/plotui"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdists
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          # a partially-uploaded release must not fail the rerun that
          # completes it
          skip-existing: true
