name: PyPI

# Builds and publishes the two PyPI packages on every version tag:
#   plotui      — the Python library (PyO3 extension, abi3 ≥ 3.9)
#   plotui-cli  — the compiled `plotui` binary in a wheel (maturin bin bindings);
#                 the library depends on it, so `pip install plotui` gets the CLI
#
# Publishing authenticates with the PYPI_API_TOKEN repo secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: ${{ matrix.package }} wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: [lib, cli]
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.package == 'cli' && '-m crates/plotui-cli/Cargo.toml' || '' }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.package }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: sdists
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/plotui-cli/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdists
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
